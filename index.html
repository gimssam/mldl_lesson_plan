<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웹 교안</title>
<meta name="description" content="마크다운 원본을 불러와 표시하는 웹 교안">
<style>
  :root{
    --color-canvas:#fffaf0;
    --color-surface-soft:#faf5e8;
    --color-surface-card:#f5f0e0;
    --color-surface-strong:#ebe6d6;
    --color-ink:#0a0a0a;
    --color-body:#3a3a3a;
    --color-body-strong:#1a1a1a;
    --color-muted:#6a6a6a;
    --color-muted-soft:#9a9a9a;
    --color-hairline:#e5e5e5;
    --color-hairline-soft:#f0f0f0;
    --color-primary:#0a0a0a;
    --color-primary-active:#1f1f1f;
    --color-on-primary:#ffffff;
    --color-pink:#ff4d8b;
    --color-teal:#1a3a3a;
    --color-lavender:#b8a4ed;
    --color-peach:#ffb084;
    --color-ochre:#e8b94a;
    --color-mint:#a4d4c5;
    --color-coral:#ff6b5a;
    --color-dark:#0a1a1a;
    --color-dark-elevated:#1a2a2a;

    --radius-xs:6px;
    --radius-sm:8px;
    --radius-md:12px;
    --radius-lg:16px;
    --radius-xl:24px;
    --radius-pill:9999px;

    --space-xxs:4px;
    --space-xs:8px;
    --space-sm:12px;
    --space-md:16px;
    --space-lg:24px;
    --space-xl:32px;
    --space-xxl:48px;
    --space-section:96px;

    --font-display:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --font-body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --font-mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--color-canvas);
    color:var(--color-body);
    font-family:var(--font-body);
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;}

  /* ---------- top nav ---------- */
  .top-nav{
    position:sticky;
    top:0;
    z-index:40;
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 var(--space-lg);
    background:rgba(255,250,240,0.92);
    backdrop-filter:saturate(180%) blur(8px);
    border-bottom:1px solid var(--color-hairline);
  }
  .top-nav__brand{
    display:flex;
    align-items:center;
    gap:var(--space-sm);
    font-family:var(--font-display);
    font-weight:600;
    font-size:14px;
    color:var(--color-ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .top-nav__dot{
    width:8px;height:8px;border-radius:var(--radius-pill);
    background:var(--color-pink);
    flex:none;
  }
  .top-nav__doc-title{
    font-weight:500;
    color:var(--color-muted);
    font-size:13px;
    max-width:40vw;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .top-nav__actions{display:flex;align-items:center;gap:var(--space-sm);}

  .btn{
    font-family:var(--font-body);
    font-size:14px;
    font-weight:600;
    line-height:1;
    border-radius:var(--radius-md);
    border:none;
    cursor:pointer;
    padding:10px 16px;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .btn-primary{background:var(--color-primary);color:var(--color-on-primary);}
  .btn-primary:hover{background:var(--color-primary-active);}
  .btn-secondary{background:var(--color-canvas);color:var(--color-ink);border:1px solid var(--color-hairline);}
  .btn-secondary:hover{border-color:var(--color-ink);}
  .btn-icon{padding:10px;border-radius:var(--radius-pill);}

  .toc-toggle{display:none;}

  /* ---------- lesson switcher ---------- */
  .lesson-tabs{
    display:flex;
    gap:var(--space-xs);
    padding:var(--space-sm) var(--space-lg) 0;
    flex-wrap:wrap;
  }
  .lesson-tab{
    background:transparent;
    color:var(--color-muted);
    font-family:var(--font-body);
    font-size:14px;
    font-weight:500;
    border:none;
    border-radius:var(--radius-pill);
    padding:8px 16px;
    cursor:pointer;
  }
  .lesson-tab.is-active{background:var(--color-surface-card);color:var(--color-ink);}

  /* ---------- hero ---------- */
  .hero{
    padding:var(--space-xxl) var(--space-lg);
    display:grid;
    grid-template-columns:7fr 5fr;
    gap:var(--space-xl);
    align-items:center;
    max-width:1280px;
    margin:0 auto;
  }
  .hero__eyebrow{
    display:inline-flex;
    align-items:center;
    gap:var(--space-xs);
    background:var(--color-surface-card);
    color:var(--color-body-strong);
    font-size:13px;
    font-weight:500;
    letter-spacing:0.3px;
    padding:4px 12px;
    border-radius:var(--radius-pill);
    margin-bottom:var(--space-md);
  }
  .hero h1{
    font-family:var(--font-display);
    font-weight:500;
    font-size:40px;
    line-height:1.15;
    letter-spacing:-1px;
    color:var(--color-ink);
    margin:0 0 var(--space-md);
  }
  .hero__subtitle{
    font-size:16px;
    color:var(--color-muted);
    margin:0 0 var(--space-lg);
    line-height:1.6;
  }
  .hero__meta{display:flex;flex-wrap:wrap;gap:var(--space-xs);}
  .badge-pill{
    display:inline-flex;
    align-items:center;
    background:var(--color-surface-card);
    color:var(--color-ink);
    font-size:13px;
    font-weight:500;
    padding:4px 12px;
    border-radius:var(--radius-pill);
  }
  .badge-pill.badge-pink{background:var(--color-pink);color:#fff;}
  .badge-pill.badge-teal{background:var(--color-teal);color:#fff;}
  .badge-pill.badge-ochre{background:var(--color-ochre);color:var(--color-ink);}

  .hero__art{
    background:var(--color-surface-soft);
    border-radius:var(--radius-xl);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:160px;
  }
  .hero__art img{width:100%;height:100%;object-fit:cover;}

  /* ---------- layout ---------- */
  .layout{
    max-width:1280px;
    margin:0 auto;
    padding:0 var(--space-lg) var(--space-section);
    display:grid;
    grid-template-columns:260px minmax(0,1fr);
    gap:var(--space-xxl);
    align-items:start;
  }

  .toc{
    position:sticky;
    top:88px;
    max-height:calc(100vh - 110px);
    overflow-y:auto;
    padding-right:var(--space-xs);
  }
  .toc__label{
    font-size:12px;
    font-weight:600;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--color-muted-soft);
    margin:0 0 var(--space-sm) var(--space-sm);
  }
  .toc__list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;}
  .toc__link{
    display:block;
    padding:8px 12px;
    border-radius:var(--radius-pill);
    color:var(--color-muted);
    font-size:14px;
    font-weight:500;
    text-decoration:none;
    line-height:1.4;
  }
  .toc__link:hover{background:var(--color-hairline-soft);color:var(--color-ink);}
  .toc__link.is-active{background:var(--color-surface-card);color:var(--color-ink);}
  .toc__sub{margin-left:var(--space-md);}
  .toc__sub .toc__link{font-size:13px;font-weight:400;}

  /* ---------- content ---------- */
  .content-card{
    background:var(--color-canvas);
    min-width:0;
  }
  .doc{max-width:760px;}

  .doc h2{
    font-family:var(--font-display);
    font-weight:500;
    font-size:28px;
    letter-spacing:-0.5px;
    line-height:1.25;
    color:var(--color-ink);
    margin:var(--space-xxl) 0 var(--space-md);
    display:flex;
    align-items:center;
    gap:var(--space-sm);
    scroll-margin-top:88px;
  }
  .doc > h2:first-child{margin-top:0;}
  .doc h2 .h2-badge{
    flex:none;
    width:34px;height:34px;
    border-radius:var(--radius-pill);
    background:var(--color-primary);
    color:var(--color-on-primary);
    font-size:15px;
    font-weight:600;
    display:flex;align-items:center;justify-content:center;
    letter-spacing:0;
  }
  .doc h3{
    font-family:var(--font-display);
    font-weight:600;
    font-size:19px;
    letter-spacing:-0.2px;
    color:var(--color-ink);
    margin:var(--space-xl) 0 var(--space-sm);
    scroll-margin-top:88px;
  }
  .doc h4{
    font-size:16px;
    font-weight:600;
    color:var(--color-ink);
    margin:var(--space-lg) 0 var(--space-xs);
  }
  .doc p{margin:0 0 var(--space-md);color:var(--color-body);}
  .doc ul,.doc ol{margin:0 0 var(--space-md);padding-left:1.3em;color:var(--color-body);}
  .doc li{margin-bottom:6px;}
  .doc li > p{margin-bottom:6px;}
  .doc strong{color:var(--color-body-strong);font-weight:600;}
  .doc hr{border:none;border-top:1px solid var(--color-hairline);margin:var(--space-xl) 0;}
  .doc a{color:var(--color-ink);text-decoration:underline;text-underline-offset:2px;}

  .doc img{
    border-radius:var(--radius-lg);
    border:1px solid var(--color-hairline);
    margin:var(--space-sm) 0 var(--space-lg);
  }

  /* label lines: 예제 코드 / 실행 결과 */
  .doc p.label-line{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:transparent;
    margin-bottom:var(--space-xs);
  }
  .doc p.label-line .label-badge{
    display:inline-flex;
    align-items:center;
    background:var(--color-ink);
    color:#fff;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.4px;
    padding:3px 10px;
    border-radius:var(--radius-pill);
  }
  .doc p.label-line.label-result .label-badge{background:var(--color-ochre);color:var(--color-ink);}

  /* callouts (blockquote) */
  .doc blockquote{
    margin:var(--space-md) 0 var(--space-lg);
    padding:var(--space-md) var(--space-lg);
    border-radius:var(--radius-lg);
    background:var(--color-surface-card);
    border-left:4px solid var(--color-lavender);
    color:var(--color-body-strong);
  }
  .doc blockquote p{margin:0;color:inherit;font-size:15px;}
  .doc blockquote.callout-1{border-left-color:var(--color-lavender);}
  .doc blockquote.callout-2{border-left-color:var(--color-peach);}
  .doc blockquote.callout-0{border-left-color:var(--color-ochre);}

  /* tables */
  .doc .table-wrap{
    overflow-x:auto;
    border:1px solid var(--color-hairline);
    border-radius:var(--radius-lg);
    margin:0 0 var(--space-lg);
  }
  .doc table{border-collapse:collapse;width:100%;font-size:14px;}
  .doc thead th{
    background:var(--color-surface-card);
    color:var(--color-body-strong);
    font-weight:600;
    text-align:left;
    padding:10px 14px;
    border-bottom:1px solid var(--color-hairline);
    white-space:nowrap;
  }
  .doc tbody td{
    padding:10px 14px;
    border-bottom:1px solid var(--color-hairline-soft);
    color:var(--color-body);
    vertical-align:top;
  }
  .doc tbody tr:last-child td{border-bottom:none;}
  .doc tbody tr:nth-child(even){background:rgba(0,0,0,0.015);}

  /* code */
  .doc .code-block{
    position:relative;
    background:var(--color-teal);
    border-radius:var(--radius-lg);
    margin:0 0 var(--space-lg);
    overflow:hidden;
  }
  .doc .code-block__bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 16px;
    background:rgba(255,255,255,0.06);
  }
  .doc .code-block__lang{
    font-family:var(--font-mono);
    font-size:12px;
    font-weight:600;
    letter-spacing:0.5px;
    color:var(--color-mint);
    text-transform:uppercase;
  }
  .doc .code-copy{
    background:transparent;
    border:1px solid rgba(255,255,255,0.25);
    color:#fff;
    font-size:12px;
    font-weight:500;
    border-radius:var(--radius-sm);
    padding:4px 10px;
    cursor:pointer;
  }
  .doc .code-copy:hover{background:rgba(255,255,255,0.12);}
  .doc pre{
    margin:0;
    padding:var(--space-md) var(--space-lg);
    overflow-x:auto;
  }
  .doc pre code{
    font-family:var(--font-mono);
    font-size:13.5px;
    line-height:1.6;
    color:#f2f0e8;
    background:transparent;
  }
  .doc :not(pre) > code{
    background:var(--color-surface-card);
    color:var(--color-body-strong);
    padding:2px 6px;
    border-radius:var(--radius-xs);
    font-family:var(--font-mono);
    font-size:0.9em;
  }
  /* minimal token colors for python */
  .tok-kw{color:var(--color-coral);}
  .tok-str{color:var(--color-ochre);}
  .tok-com{color:var(--color-muted-soft);}
  .tok-num{color:var(--color-peach);}
  .tok-fn{color:var(--color-mint);}

  /* footer */
  .site-footer{
    background:var(--color-surface-soft);
    color:var(--color-body);
    padding:var(--space-xxl) var(--space-lg);
    text-align:center;
    font-size:14px;
  }
  .site-footer .note{color:var(--color-muted-soft);font-size:13px;margin-top:var(--space-xs);}

  /* scroll top */
  .scroll-top{
    position:fixed;
    right:var(--space-lg);
    bottom:var(--space-lg);
    z-index:30;
    width:44px;height:44px;
    border-radius:var(--radius-pill);
    background:var(--color-primary);
    color:#fff;
    border:none;
    cursor:pointer;
    display:none;
    align-items:center;justify-content:center;
    font-size:18px;
    box-shadow:0 8px 24px rgba(10,10,10,0.18);
  }
  .scroll-top.is-visible{display:flex;}

  /* state screens */
  .state-screen{
    max-width:520px;
    margin:120px auto;
    text-align:center;
    padding:0 var(--space-lg);
  }
  .state-screen h2{font-family:var(--font-display);font-weight:500;font-size:24px;color:var(--color-ink);margin-bottom:var(--space-sm);}
  .state-screen p{color:var(--color-muted);line-height:1.6;}
  .state-screen code{background:var(--color-surface-card);padding:2px 8px;border-radius:var(--radius-xs);}
  .spinner{
    width:28px;height:28px;
    border-radius:50%;
    border:3px solid var(--color-hairline);
    border-top-color:var(--color-ink);
    margin:0 auto var(--space-md);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* responsive */
  @media (max-width:960px){
    .hero{grid-template-columns:1fr;}
    .hero__art{order:-1;min-height:180px;}
    .layout{grid-template-columns:1fr;}
    .toc{
      position:fixed;
      top:64px;left:0;right:0;bottom:0;
      background:var(--color-canvas);
      padding:var(--space-lg);
      max-height:none;
      transform:translateY(-110%);
      transition:transform 0.2s ease;
      z-index:35;
    }
    .toc.is-open{transform:translateY(0);}
    .toc-toggle{display:inline-flex;}
    .doc{max-width:100%;}
  }

  @media print{
    .top-nav,.toc,.scroll-top,.lesson-tabs{display:none !important;}
    .layout{grid-template-columns:1fr;}
    body{background:#fff;}
  }
</style>
</head>
<body>

<nav class="top-nav">
  <div class="top-nav__brand">
    <span class="top-nav__dot"></span>
    <span id="brandLabel">웹 교안</span>
    <span class="top-nav__doc-title" id="navDocTitle"></span>
  </div>
  <div class="top-nav__actions">
    <button class="btn btn-secondary toc-toggle" id="tocToggle" type="button">목차</button>
    <button class="btn btn-secondary" id="printBtn" type="button">인쇄</button>
  </div>
</nav>

<div class="lesson-tabs" id="lessonTabs" style="display:none;"></div>

<div id="app">
  <div class="state-screen" id="loadingScreen">
    <div class="spinner"></div>
    <h2>교안을 불러오는 중입니다</h2>
    <p>마크다운 원본 파일을 읽어오고 있습니다.</p>
  </div>
</div>

<button class="scroll-top" id="scrollTopBtn" type="button" aria-label="맨 위로">↑</button>

<script src="vendor-marked.min.js"></script>
<script src="vendor-dompurify.min.js"></script>
<script>
(function(){
  "use strict";

  var APP = document.getElementById("app");
  var NAV_DOC_TITLE = document.getElementById("navDocTitle");
  var LESSON_TABS = document.getElementById("lessonTabs");
  var SCROLL_BTN = document.getElementById("scrollTopBtn");
  var PRINT_BTN = document.getElementById("printBtn");

  var DEFAULT_MANIFEST = "lessons.json";

  function qs(name){
    var params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  function escapeHtml(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function renderError(title, detail){
    APP.innerHTML =
      '<div class="state-screen">' +
        '<h2>' + escapeHtml(title) + '</h2>' +
        '<p>' + detail + '</p>' +
      '</div>';
  }

  function fetchText(path){
    return fetch(path, {cache:"no-cache"}).then(function(res){
      if(!res.ok){ throw new Error("HTTP " + res.status); }
      return res.text();
    });
  }

  function loadManifest(){
    return fetchText(DEFAULT_MANIFEST)
      .then(function(txt){
        try{ return JSON.parse(txt); }
        catch(e){ return {lessons:[]}; }
      })
      .catch(function(){ return {lessons:[]}; });
  }

  function buildTabs(lessons, activeFile){
    if(!lessons || lessons.length < 2){
      LESSON_TABS.style.display = "none";
      LESSON_TABS.innerHTML = "";
      return;
    }
    LESSON_TABS.style.display = "flex";
    LESSON_TABS.innerHTML = lessons.map(function(l){
      var cls = "lesson-tab" + (l.file === activeFile ? " is-active" : "");
      return '<button class="' + cls + '" data-file="' + escapeHtml(l.file) + '" type="button">' +
        escapeHtml(l.label || l.file) + '</button>';
    }).join("");

    Array.prototype.forEach.call(LESSON_TABS.querySelectorAll(".lesson-tab"), function(btn){
      btn.addEventListener("click", function(){
        var f = btn.getAttribute("data-file");
        var url = new URL(window.location.href);
        url.searchParams.set("doc", f);
        window.location.href = url.toString();
      });
    });
  }

  // split off the first two bold-only lines as hero title/subtitle if the
  // document follows the "**제목**" / "**부제**" convention used by the
  // lesson template. falls back gracefully if the pattern is not found.
  function extractHero(mdText, fallbackTitle){
    var lines = mdText.split("\n");
    var i = 0;
    while(i < lines.length && lines[i].trim() === "") i++;

    var titleMatch = i < lines.length ? lines[i].match(/^\*\*(.+)\*\*$/) : null;
    if(!titleMatch){
      return {title: fallbackTitle, subtitle: "", bodyStart: 0};
    }
    var title = titleMatch[1];
    var j = i + 1;
    var subtitle = "";
    if(j < lines.length){
      var subMatch = lines[j].match(/^\*\*(.+)\*\*$/);
      if(subMatch){ subtitle = subMatch[1]; j++; }
    }
    return {title: title, subtitle: subtitle, bodyStart: j};
  }

  function slugify(text, index){
    return "sec-" + index;
  }

  // single-pass tokenizer: matches comments / strings / numbers / keywords
  // against the ORIGINAL escaped source only, so inserted <span> markup is
  // never re-scanned by a later rule (which would corrupt the HTML).
  var PY_TOKEN_RE = /(#[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(\d+\.?\d*)\b|\b(import|from|as|def|class|return|if|elif|else|for|while|in|not|and|or|is|None|True|False|try|except|finally|with|lambda|yield|break|continue|pass|global|self)\b/g;

  function highlightPython(code){
    var escaped = escapeHtml(code);
    return escaped.replace(PY_TOKEN_RE, function(m, comment, str, num, kw){
      if(comment !== undefined) return '<span class="tok-com">' + comment + '</span>';
      if(str !== undefined) return '<span class="tok-str">' + str + '</span>';
      if(num !== undefined) return '<span class="tok-num">' + num + '</span>';
      if(kw !== undefined) return '<span class="tok-kw">' + kw + '</span>';
      return m;
    });
  }

  function enhance(container){
    // heading ids + toc data
    var headings = container.querySelectorAll("h2, h3");
    var tocEntries = [];
    headings.forEach(function(h, idx){
      var id = slugify(h.textContent, idx);
      h.id = id;
      var isH2 = h.tagName === "H2";
      if(isH2){
        var m = h.textContent.match(/^(\d+)\.\s*(.+)$/);
        if(m){
          h.innerHTML = '<span class="h2-badge">' + m[1] + '</span><span>' + escapeHtml(m[2]) + '</span>';
        }
      }
      tocEntries.push({id:id, text:h.textContent, level: isH2 ? 2 : 3});
    });

    // blockquotes -> callouts
    var quotes = container.querySelectorAll("blockquote");
    quotes.forEach(function(bq, idx){
      bq.classList.add("callout-" + (idx % 3));
    });

    // tables -> scroll wrap
    var tables = container.querySelectorAll("table");
    tables.forEach(function(t){
      var wrap = document.createElement("div");
      wrap.className = "table-wrap";
      t.parentNode.insertBefore(wrap, t);
      wrap.appendChild(t);
    });

    // label lines: **예제 코드**: ... / **실행 결과**
    var paras = container.querySelectorAll("p");
    paras.forEach(function(p){
      var strong = p.querySelector("strong");
      if(!strong || p.firstElementChild !== strong) return;
      var label = strong.textContent.trim();
      if(label === "예제 코드" || label === "실행 결과"){
        p.classList.add("label-line");
        if(label === "실행 결과"){ p.classList.add("label-result"); }
        strong.classList.add("label-badge");
      }
    });

    // code blocks
    var pres = container.querySelectorAll("pre > code");
    pres.forEach(function(codeEl){
      var pre = codeEl.parentElement;
      var langClass = Array.prototype.find.call(codeEl.classList, function(c){ return c.indexOf("language-") === 0; });
      var lang = langClass ? langClass.replace("language-","") : "text";
      var raw = codeEl.textContent;

      if(lang === "python" || lang === "py"){
        codeEl.innerHTML = highlightPython(raw);
      }

      var wrap = document.createElement("div");
      wrap.className = "code-block";
      var bar = document.createElement("div");
      bar.className = "code-block__bar";
      bar.innerHTML = '<span class="code-block__lang">' + escapeHtml(lang) + '</span>' +
        '<button class="code-copy" type="button">복사</button>';
      pre.parentNode.insertBefore(wrap, pre);
      wrap.appendChild(bar);
      wrap.appendChild(pre);

      bar.querySelector(".code-copy").addEventListener("click", function(){
        navigator.clipboard.writeText(raw).then(function(){
          var btn = bar.querySelector(".code-copy");
          var original = btn.textContent;
          btn.textContent = "복사됨";
          setTimeout(function(){ btn.textContent = original; }, 1200);
        }).catch(function(){});
      });
    });

    return tocEntries;
  }

  function buildToc(entries){
    if(!entries.length) return "";
    var html = '<div class="toc__label">목차</div><ul class="toc__list">';
    entries.forEach(function(e){
      var cls = "toc__link" + (e.level === 3 ? " " : "");
      var wrapClass = e.level === 3 ? "toc__sub" : "";
      html += '<li class="' + wrapClass + '"><a class="toc__link" data-target="' + e.id + '" href="#' + e.id + '">' + escapeHtml(e.text) + '</a></li>';
    });
    html += "</ul>";
    return html;
  }

  function wireToc(tocEl){
    var links = tocEl.querySelectorAll(".toc__link");
    var map = {};
    links.forEach(function(l){ map[l.getAttribute("data-target")] = l; });

    var headings = document.querySelectorAll(".doc h2, .doc h3");
    if(!headings.length || !("IntersectionObserver" in window)) return;

    var observer = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        var link = map[entry.target.id];
        if(!link) return;
        if(entry.isIntersecting){
          links.forEach(function(l){ l.classList.remove("is-active"); });
          link.classList.add("is-active");
        }
      });
    }, {rootMargin: "-100px 0px -70% 0px"});

    headings.forEach(function(h){ observer.observe(h); });

    var toggle = document.getElementById("tocToggle");
    if(toggle){
      toggle.addEventListener("click", function(){
        tocEl.classList.toggle("is-open");
      });
      links.forEach(function(l){
        l.addEventListener("click", function(){ tocEl.classList.remove("is-open"); });
      });
    }
  }

  function render(mdText, meta){
    var hero = extractHero(mdText, meta.label || meta.file);
    var bodyLines = mdText.split("\n").slice(hero.bodyStart);
    var bodyMd = bodyLines.join("\n");

    var rawHtml = marked.parse(bodyMd, {gfm:true, breaks:false});
    var cleanHtml = window.DOMPurify ? DOMPurify.sanitize(rawHtml, {ADD_ATTR:["target"]}) : rawHtml;

    document.title = hero.title + " · 웹 교안";
    NAV_DOC_TITLE.textContent = hero.title;

    var heroArt = meta.heroImage ?
      '<div class="hero__art"><img src="' + meta.heroImage + '" alt=""></div>' :
      '<div class="hero__art"></div>';

    APP.innerHTML =
      '<header class="hero">' +
        '<div>' +
          '<span class="hero__eyebrow">웹 교안 · 마크다운 원본 연동</span>' +
          '<h1>' + escapeHtml(hero.title) + '</h1>' +
          (hero.subtitle ? '<p class="hero__subtitle">' + escapeHtml(hero.subtitle) + '</p>' : '') +
        '</div>' +
        heroArt +
      '</header>' +
      '<div class="layout">' +
        '<aside class="toc" id="tocPanel"></aside>' +
        '<main class="content-card"><article class="doc" id="docBody"></article></main>' +
      '</div>' +
      '<footer class="site-footer">' +
        '<div>' + escapeHtml(meta.footer || "") + '</div>' +
        '<div class="note">이 페이지는 <code>' + escapeHtml(meta.file) + '</code> 파일을 매번 새로 불러와 표시합니다. 마크다운 원본을 수정하면 새로고침만으로 반영됩니다.</div>' +
      '</footer>';

    var docBody = document.getElementById("docBody");
    docBody.innerHTML = cleanHtml;
    var tocEntries = enhance(docBody);
    document.getElementById("tocPanel").innerHTML = buildToc(tocEntries);
    wireToc(document.getElementById("tocPanel"));
  }

  function boot(){
    loadManifest().then(function(manifest){
      var lessons = manifest.lessons || [];
      var requested = qs("doc");
      var target = requested ||
        (lessons[0] && lessons[0].file) ||
        "ch532_신경망심층학습.md";

      buildTabs(lessons, target);

      var meta = lessons.find(function(l){ return l.file === target; }) || {file: target, label: target};
      meta.heroImage = "images/banner_header.png";
      meta.footer = "(주)KD 아카데미 | 훈련교사 김명철 · AI 특화 인재양성 과정";

      fetchText(target)
        .then(function(mdText){ render(mdText, meta); })
        .catch(function(err){
          renderError(
            "마크다운 파일을 불러오지 못했습니다",
            "<code>" + escapeHtml(target) + "</code> 파일을 찾을 수 없거나 이 페이지를 <code>file://</code>로 직접 열었을 가능성이 있습니다.<br>" +
            "GitHub Pages로 배포한 주소로 접속하거나, 로컬에서는 간이 서버(예: <code>python -m http.server</code>)를 통해 열어주세요.<br>" +
            "오류 내용: " + escapeHtml(err.message)
          );
        });
    });
  }

  window.addEventListener("scroll", function(){
    if(window.scrollY > 480){ SCROLL_BTN.classList.add("is-visible"); }
    else{ SCROLL_BTN.classList.remove("is-visible"); }
  });
  SCROLL_BTN.addEventListener("click", function(){
    window.scrollTo({top:0, behavior:"smooth"});
  });
  PRINT_BTN.addEventListener("click", function(){ window.print(); });

  boot();
})();
</script>
